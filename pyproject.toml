[project]
name = "command-center"
version = "0.1.0"
description = "Self-hosted daily brief: Gmail/Calendar/Tasks triage, projects, schedule, finances, and history reporting."
readme = "README.md"
authors = [
    { name = "Abdessamad Zerdan", email = "zerdanabdessamad@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.121.0",
    "apscheduler>=3.11.3",
    "fastapi>=0.141.1",
    "fastembed>=0.8.0",
    "google-api-python-client>=2.198.0",
    "google-auth>=2.56.3",
    "google-auth-oauthlib>=1.4.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "openai>=3.0.0",
    "pathspec>=0.12.1",
    "python-multipart>=0.0.32",
    "tzdata>=2026.3",
    "uvicorn[standard]>=0.52.1",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
