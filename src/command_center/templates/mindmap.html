{% extends "base.html" %}
{% block title %}Command Center — Map{% endblock %}

{% block extra_head %}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Kalam:wght@400;700&display=swap" rel="stylesheet">
<style>
  .map-font-title { font-family: 'Caveat', cursive; }
  .map-font-hand { font-family: 'Kalam', cursive; }
  .map-canvas {
    background-image: radial-gradient(circle, rgba(181, 86, 58, 0.10) 1px, transparent 1px);
    background-size: 22px 22px;
  }
  .dark .map-canvas {
    background-image: radial-gradient(circle, rgba(217, 119, 87, 0.12) 1px, transparent 1px);
  }
  .map-card { touch-action: none; }
  .map-pin { box-shadow: 0 1px 2px rgba(0, 0, 0, 0.25); }
</style>
{% endblock %}

{% block content %}
<script>
function boardSwitcher(boards, current) {
  return {
    boards: boards,
    current: current,
    creating: false,
    newName: '',
    createBoard() {
      const name = this.newName.trim();
      if (!name) return;
      fetch('/map/boards', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name }),
      }).then(async r => {
        const data = await r.json().catch(() => ({}));
        if (r.ok) window.location.href = '/map?board=' + data.id;
      });
    },
    renameCurrent() {
      const name = window.prompt('Rename board', this.current.name);
      if (name === null) return;
      const trimmed = name.trim();
      if (!trimmed) return;
      fetch('/map/boards/' + this.current.id, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: trimmed }),
      }).then(r => { if (r.ok) window.location.reload(); });
    },
    deleteCurrent() {
      if (!window.confirm('Delete "' + this.current.name + '"? Its cards go with it.')) return;
      fetch('/map/boards/' + this.current.id, { method: 'DELETE' }).then(r => {
        if (r.ok) window.location.href = '/map';
      });
    },
  };
}

function mindMapCanvas(initialNodes, pinnableProjects, kinds, boardId) {
  return {
    nodes: initialNodes,
    pinnableProjects: pinnableProjects,
    kinds: kinds,
    boardId: boardId,

    canvasPx: { w: 0, h: 0 },

    dragId: null,
    dragStartX: 0, dragStartY: 0,
    dragOrigX: 0, dragOrigY: 0,
    moved: false,

    // Dragging FROM a card's pin dot draws a connector instead of
    // moving the card — a separate gesture from startDrag/onDrag above,
    // triggered on the pin dot itself with .stop so it doesn't also
    // start a move-drag on the parent card.
    connectingFromId: null,
    connectFrom: { x: 0, y: 0 },
    connectCursor: { x: 0, y: 0 },

    adding: false,
    newKind: 'target',
    newTitle: '', newNote: '', newTargetDate: '', newProjectId: '', newLinkedLabelId: '',
    addError: '',

    active: null,
    editTitle: '', editNote: '', editTargetDate: '',
    editSaving: false, editError: '',

    kindMeta: {
      label: { label: 'Label', badge: 'bg-[#fdf8f0] dark:bg-stone-900/40 text-stone-700 dark:text-stone-200 border-2 border-dashed border-stone-400 dark:border-stone-500' },
      project: { label: 'Project', badge: 'bg-[#faece7] dark:bg-rust-light/10 text-rust dark:text-rust-light border-rust/30 dark:border-rust-light/30' },
      target: { label: 'Target', badge: 'bg-emerald-50 dark:bg-emerald-900/20 text-emerald-800 dark:text-emerald-300 border-emerald-300 dark:border-emerald-700' },
      hackathon: { label: 'Hackathon', badge: 'bg-sky-50 dark:bg-sky-900/20 text-sky-800 dark:text-sky-300 border-sky-300 dark:border-sky-700' },
      competition: { label: 'Competition', badge: 'bg-violet-50 dark:bg-violet-900/20 text-violet-800 dark:text-violet-300 border-violet-300 dark:border-violet-700' },
      research: { label: 'Research', badge: 'bg-stone-100 dark:bg-stone-700 text-stone-600 dark:text-stone-300 border-stone-300 dark:border-stone-600' },
    },

    get labelOptions() {
      return this.nodes.filter(n => n.kind === 'label');
    },
    get activeLabelOptions() {
      if (!this.active) return this.labelOptions;
      return this.labelOptions.filter(l => l.id !== this.active.id);
    },

    cardTitle(node) {
      return node.kind === 'project' ? node.project_name : node.title;
    },
    cardNote(node) {
      if (node.kind === 'project') return node.project_current_sprint || node.project_description || '';
      return node.note || '';
    },
    rotation(node) {
      // Deterministic -3..3deg wobble per card, so it reads as
      // hand-placed instead of re-jittering on every reload.
      return ((node.id * 37) % 7) - 3;
    },

    updateCanvasSize() {
      if (!this.$refs.canvas) return;
      const rect = this.$refs.canvas.getBoundingClientRect();
      this.canvasPx = { w: rect.width, h: rect.height };
    },

    // A hand-drawn connector from each card's linked label to itself —
    // computed in real pixels (not the 0-100 percent space cards use)
    // so the curve doesn't distort on a non-square canvas, and as a
    // getter so it stays in sync while a card is mid-drag. Two chained
    // quadratic segments through jittered midpoints (not one smooth
    // arc) so it reads as sketched, not ruler-drawn; a label-to-label
    // link (a sublabel) additionally gets a small hand-drawn loop
    // flourish at its midpoint and its own color, so hierarchy between
    // labels reads differently at a glance from a label's membership.
    get connectorPaths() {
      if (!this.canvasPx.w || !this.canvasPx.h) return [];
      const anchorOffsetX = 78; // ~ half a card's width — approximate, not pixel-exact
      const anchorOffsetY = 12;
      const toPx = (n) => ({
        x: (n.x / 100) * this.canvasPx.w + anchorOffsetX,
        y: (n.y / 100) * this.canvasPx.h + anchorOffsetY,
      });
      const labelsById = {};
      this.nodes.forEach(n => { if (n.kind === 'label') labelsById[n.id] = n; });
      const paths = [];
      this.nodes.forEach(n => {
        if (!n.linked_label_id) return;
        const label = labelsById[n.linked_label_id];
        if (!label) return;
        const a = toPx(label), b = toPx(n);
        paths.push({
          id: label.id + '-' + n.id,
          d: this.sketchyPath(a, b, label.id * 53 + n.id * 17),
          isSublabel: n.kind === 'label',
          loop: n.kind === 'label' ? this.loopFlourish(a, b, label.id * 31 + n.id * 11) : null,
        });
      });
      return paths;
    },

    // Two quadratic segments joined at a shared midpoint (C1-continuous,
    // so the join doesn't kink) through two independently-jittered
    // control points, instead of one mathematically-smooth arc — reads
    // as a wavier, sketched-by-hand stroke. Deterministic per pair (not
    // Math.random()) so the wobble doesn't reshuffle on every re-render.
    sketchyPath(a, b, seed) {
      const dx = b.x - a.x, dy = b.y - a.y;
      const len = Math.hypot(dx, dy) || 1;
      const nx = -dy / len, ny = dx / len;
      const w1 = ((seed * 53) % 25) - 12;
      const w2 = ((seed * 31 + 7) % 19) - 9;
      const m1x = a.x + dx * 0.33 + nx * w1, m1y = a.y + dy * 0.33 + ny * w1;
      const m2x = a.x + dx * 0.66 + nx * w2, m2y = a.y + dy * 0.66 + ny * w2;
      const jx = (m1x + m2x) / 2, jy = (m1y + m2y) / 2;
      return `M ${a.x} ${a.y} Q ${m1x} ${m1y} ${jx} ${jy} Q ${m2x} ${m2y} ${b.x} ${b.y}`;
    },

    // A small irregular loop at a sublabel connector's midpoint — the
    // "circle a word to show it belongs" doodle, not a geometric curve.
    loopFlourish(a, b, seed) {
      const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
      const r = 8 + (seed % 4);
      const squish = 0.6 + ((seed % 5) / 10);
      const rotate = (seed * 17) % 40 - 20;
      return { cx: mx, cy: my, rx: r, ry: r * squish, rotate };
    },

    // <svg> children need real markup, not Alpine's template x-for —
    // <template> nested directly inside an <svg> is parsed as foreign
    // (SVG) content by the browser's HTML parser, not upgraded to a
    // real HTMLTemplateElement, so Alpine's x-for/:d bindings silently
    // no-op on it (confirmed live: the cloned <path> exists but its
    // `d` attribute stays empty). Setting .innerHTML directly on an
    // SVG-namespaced element parses the string as SVG correctly, so
    // x-html on a <g> sidesteps the whole problem. Only numbers
    // (computed path coordinates) ever land in this string — never
    // user-typed text — so there's no injection risk in using x-html.
    get connectorMarkup() {
      let markup = this.connectorPaths.map(p => {
        const cls = p.isSublabel ? 'stroke-rust dark:stroke-rust-light' : 'stroke-stone-400 dark:stroke-stone-500';
        let segment = `<path d="${p.d}" fill="none" stroke-width="2" stroke-linecap="round" class="${cls}" marker-end="url(#map-arrow-${p.isSublabel ? 'sub' : 'default'})"></path>`;
        if (p.loop) {
          const l = p.loop;
          segment += `<ellipse cx="${l.cx}" cy="${l.cy}" rx="${l.rx}" ry="${l.ry}" transform="rotate(${l.rotate} ${l.cx} ${l.cy})" fill="none" stroke-width="1.6" class="${cls}"></ellipse>`;
        }
        return segment;
      }).join('');
      if (this.connectingFromId !== null) {
        const f = this.connectFrom, c = this.connectCursor;
        markup += `<path d="M ${f.x} ${f.y} L ${c.x} ${c.y}" fill="none" stroke-width="2" stroke-dasharray="5 5" class="stroke-stone-400 dark:stroke-stone-500"></path>`;
      }
      return markup;
    },

    startDrag(event, node) {
      if (event.button !== undefined && event.button !== 0) return;
      this.dragId = node.id;
      this.moved = false;
      this.dragStartX = event.clientX;
      this.dragStartY = event.clientY;
      this.dragOrigX = node.x;
      this.dragOrigY = node.y;
      event.currentTarget.setPointerCapture(event.pointerId);
    },
    onDrag(event) {
      // Bound to @pointermove.window — fires on every pointer move
      // anywhere on the page, so bail immediately unless a card-drag or
      // a connector-drag is actually in progress, rather than reading
      // $refs.canvas (and recomputing a rect) on every idle mouse move.
      if (this.dragId === null && this.connectingFromId === null) return;
      const canvas = this.$refs.canvas.getBoundingClientRect();
      if (this.connectingFromId !== null) {
        this.connectCursor = { x: event.clientX - canvas.left, y: event.clientY - canvas.top };
      }
      if (this.dragId === null) return;
      const dxPct = ((event.clientX - this.dragStartX) / canvas.width) * 100;
      const dyPct = ((event.clientY - this.dragStartY) / canvas.height) * 100;
      if (Math.abs(dxPct) > 0.3 || Math.abs(dyPct) > 0.3) this.moved = true;
      const node = this.nodes.find(n => n.id === this.dragId);
      if (!node) return;
      node.x = Math.max(2, Math.min(72, this.dragOrigX + dxPct));
      node.y = Math.max(2, Math.min(84, this.dragOrigY + dyPct));
    },
    endDrag(event, node) {
      if (this.dragId === null) return;
      const wasMoved = this.moved;
      const draggedId = this.dragId;
      this.dragId = null;
      this.moved = false;
      if (wasMoved) {
        const n = this.nodes.find(x => x.id === draggedId);
        if (n) {
          fetch('/map/nodes/' + draggedId + '/position', {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ x: n.x, y: n.y }),
          });
        }
      } else {
        this.openDetail(node);
      }
    },

    // Drag FROM a card's pin dot to a label (or from a label to any
    // card) to link them, instead of picking from the "Link to label"
    // select. Whichever end is the label becomes the parent; if both
    // ends are labels (a sublabel), the card the drag STARTED from
    // becomes the child pointing at the one it was dropped on.
    startConnect(event, node) {
      if (event.button !== undefined && event.button !== 0) return;
      this.connectingFromId = node.id;
      const canvas = this.$refs.canvas.getBoundingClientRect();
      this.connectFrom = { x: event.clientX - canvas.left, y: event.clientY - canvas.top };
      this.connectCursor = { ...this.connectFrom };
      event.currentTarget.setPointerCapture(event.pointerId);
    },
    endConnect(event) {
      if (this.connectingFromId === null) return;
      const sourceId = this.connectingFromId;
      this.connectingFromId = null;
      const dropEl = document.elementFromPoint(event.clientX, event.clientY);
      const cardEl = dropEl ? dropEl.closest('.map-card') : null;
      if (!cardEl) return;
      const targetId = Number(cardEl.dataset.nodeId);
      if (!targetId || targetId === sourceId) return;
      this.linkNodes(sourceId, targetId);
    },
    linkNodes(sourceId, targetId) {
      const source = this.nodes.find(n => n.id === sourceId);
      const target = this.nodes.find(n => n.id === targetId);
      if (!source || !target) return;
      let childId, parentId;
      if (target.kind === 'label') {
        childId = sourceId; parentId = targetId;
      } else if (source.kind === 'label') {
        childId = targetId; parentId = sourceId;
      } else {
        return; // neither end is a label — nothing to link
      }
      this.setLabelLink(childId, parentId);
    },
    setLabelLink(nodeId, linkedLabelId) {
      const node = this.nodes.find(n => n.id === nodeId);
      if (!node) return;
      fetch('/map/nodes/' + nodeId + '/label', {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ linked_label_id: linkedLabelId }),
      }).then(r => {
        if (r.ok) {
          node.linked_label_id = linkedLabelId;
          if (this.active && this.active.id === nodeId) this.active.linked_label_id = linkedLabelId;
        }
      });
    },

    openAdd() {
      this.adding = true;
      this.newKind = this.pinnableProjects.length ? 'project' : 'target';
      this.newTitle = ''; this.newNote = ''; this.newTargetDate = ''; this.newProjectId = ''; this.newLinkedLabelId = '';
      this.addError = '';
    },
    submitAdd() {
      this.addError = '';
      const payload = { board_id: this.boardId, kind: this.newKind, x: 15 + Math.random() * 55, y: 15 + Math.random() * 60 };
      if (this.newKind === 'project') {
        if (!this.newProjectId) { this.addError = 'Pick a project.'; return; }
        payload.project_id = Number(this.newProjectId);
      } else {
        if (!this.newTitle.trim()) { this.addError = 'Title is required.'; return; }
        payload.title = this.newTitle.trim();
        payload.note = this.newNote.trim();
        if (this.newKind !== 'label') payload.target_date = this.newTargetDate || null;
      }
      if (this.newLinkedLabelId) payload.linked_label_id = Number(this.newLinkedLabelId);
      fetch('/map/nodes', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      }).then(async r => {
        const data = await r.json().catch(() => ({}));
        if (!r.ok) { this.addError = data.detail || 'Could not add that card.'; return; }
        window.location.reload();
      });
    },

    openDetail(node) {
      this.active = node;
      this.editTitle = node.kind === 'project' ? '' : node.title;
      this.editNote = node.kind === 'project' ? '' : node.note;
      this.editTargetDate = node.target_date || '';
      this.editSaving = false;
      this.editError = '';
    },
    closeDetail() { this.active = null; },
    // Own-text fields (title/note/date) and the label link save
    // independently: the link works on every kind including
    // kind='project', whose title/note/date stay locked to the
    // project it mirrors (see update_map_node_label_link's docstring).
    saveDetail() {
      if (!this.active || this.active.kind === 'project') return;
      this.editSaving = true; this.editError = '';
      const isLabel = this.active.kind === 'label';
      fetch('/map/nodes/' + this.active.id, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          title: this.editTitle.trim(),
          note: this.editNote.trim(),
          target_date: isLabel ? null : (this.editTargetDate || null),
        }),
      }).then(async r => {
        this.editSaving = false;
        const data = await r.json().catch(() => ({}));
        if (!r.ok) { this.editError = data.detail || 'Could not save.'; return; }
        this.active.title = this.editTitle.trim();
        this.active.note = this.editNote.trim();
        this.active.target_date = isLabel ? null : (this.editTargetDate || null);
      });
    },
    removeActive() {
      if (!this.active) return;
      const label = this.active.kind === 'project' ? 'Unpin this project from the map?' : 'Remove this card?';
      if (!confirm(label)) return;
      const id = this.active.id;
      fetch('/map/nodes/' + id, { method: 'DELETE' }).then(r => {
        if (r.ok) { this.closeDetail(); window.location.reload(); }
      });
    },
  };
}
</script>

<header class="border-b border-stone-200 dark:border-stone-700 px-4 py-3 sm:px-6 pr-28 sm:pr-32">
  <div class="text-[11px] uppercase tracking-wider text-stone-500 dark:text-stone-400">Daily Command Center</div>
  <h1 class="font-serif text-lg text-stone-900 dark:text-stone-100">Map</h1>
</header>

<main
  class="px-4 sm:px-6 py-6"
  x-data='mindMapCanvas({{ nodes | tojson }}, {{ pinnable_projects | tojson }}, {{ kinds | tojson }}, {{ current_board["id"] }})'
  @pointermove.window="onDrag($event)"
>

  <div x-data='boardSwitcher({{ boards | tojson }}, {{ current_board | tojson }})' class="flex items-center gap-2 flex-wrap mb-3">
    <template x-for="b in boards" :key="b.id">
      <a
        :href="'/map?board=' + b.id"
        :class="b.id === current.id ? 'bg-rust text-white dark:bg-rust-light' : 'bg-stone-100 dark:bg-stone-800 text-stone-600 dark:text-stone-300 hover:bg-stone-200 dark:hover:bg-stone-700'"
        class="text-xs px-3 py-1.5 rounded-full font-medium"
        x-text="b.name"
      ></a>
    </template>

    <button type="button" @click="creating = true; newName = ''" x-show="!creating" class="text-xs px-2.5 py-1.5 rounded-full border border-dashed border-stone-300 dark:border-stone-600 text-stone-500 dark:text-stone-400 hover:text-stone-900 dark:hover:text-stone-100">+ Board</button>
    <div x-show="creating" x-cloak class="flex items-center gap-1.5">
      <input type="text" x-model="newName" @keydown.enter="createBoard()" @keydown.escape="creating = false" placeholder="Board name" class="text-xs bg-white dark:bg-stone-800 border border-stone-300 dark:border-stone-600 rounded-full px-3 py-1.5 text-stone-900 dark:text-stone-100 focus:outline-none focus:border-rust dark:focus:border-rust-light w-32">
      <button type="button" @click="createBoard()" class="text-xs px-2.5 py-1.5 rounded-full bg-rust hover:bg-[#9c4830] dark:bg-rust-light dark:hover:bg-[#e08761] text-white font-medium">Add</button>
      <button type="button" @click="creating = false" class="text-xs text-stone-400 hover:text-stone-700 dark:hover:text-stone-200">Cancel</button>
    </div>

    <div class="flex items-center gap-1 ml-1">
      <button type="button" @click="renameCurrent()" title="Rename board" aria-label="Rename board" class="w-6 h-6 flex items-center justify-center rounded text-stone-400 dark:text-stone-500 hover:text-stone-900 dark:hover:text-stone-100 hover:bg-stone-100 dark:hover:bg-stone-700">
        <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>
      </button>
      <button type="button" @click="deleteCurrent()" title="Delete board" aria-label="Delete board" class="w-6 h-6 flex items-center justify-center rounded text-stone-400 dark:text-stone-500 hover:text-red-600 dark:hover:text-red-400 hover:bg-stone-100 dark:hover:bg-stone-700">
        <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6"/></svg>
      </button>
    </div>
  </div>

  <div class="flex items-center justify-between gap-3 mb-4 flex-wrap">
    <p class="text-xs text-stone-500 dark:text-stone-400 max-w-md">Drag cards anywhere to arrange your focus areas. Click a card for details or to edit.</p>
    <button type="button" @click="openAdd()" class="shrink-0 text-xs px-3 py-1.5 rounded-full bg-rust hover:bg-[#9c4830] dark:bg-rust-light dark:hover:bg-[#e08761] text-white font-medium">+ Add to map</button>
  </div>

  <template x-if="nodes.length === 0">
    <div class="map-canvas rounded-2xl border border-dashed border-stone-300 dark:border-stone-600 px-6 py-16 text-center">
      <p class="map-font-title text-3xl text-stone-500 dark:text-stone-400">Nothing pinned yet</p>
      <p class="text-xs text-stone-400 dark:text-stone-500 mt-1">Start with a label (e.g. "September"), then pin a project, or add a target, hackathon, competition, or research idea.</p>
    </div>
  </template>

  <div
    x-show="nodes.length > 0"
    x-ref="canvas"
    x-init="updateCanvasSize(); $nextTick(updateCanvasSize)"
    @resize.window="updateCanvasSize()"
    class="map-canvas relative w-full rounded-2xl border border-stone-200 dark:border-stone-700 overflow-hidden"
    style="min-height: 62vh;"
  >
    <svg class="absolute inset-0 pointer-events-none" style="width: 100%; height: 100%;">
      <defs>
        <marker id="map-arrow-default" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
          <path d="M0,0 L6,3 L0,6 Z" class="fill-stone-400 dark:fill-stone-500" />
        </marker>
        <marker id="map-arrow-sub" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
          <path d="M0,0 L6,3 L0,6 Z" class="fill-rust dark:fill-rust-light" />
        </marker>
      </defs>
      <g x-html="connectorMarkup" class="stroke-stone-400 dark:stroke-stone-500"></g>
    </svg>

    <template x-for="node in nodes" :key="node.id">
      <div
        class="map-card card-lift absolute select-none cursor-grab active:cursor-grabbing rounded-xl px-3 py-2.5"
        :class="node.kind === 'label' ? kindMeta.label.badge + ' w-auto max-w-xs' : kindMeta[node.kind].badge + ' w-36 sm:w-44 border'"
        :style="`left: ${node.x}%; top: ${node.y}%; transform: rotate(${rotation(node)}deg); transform-origin: center;`"
        :data-node-id="node.id"
        @pointerdown="startDrag($event, node)"
        @pointerup="endDrag($event, node)"
      >
        <span
          class="map-pin absolute -top-1.5 left-1/2 -translate-x-1/2 w-3 h-3 rounded-full bg-rust dark:bg-rust-light border border-white/60 dark:border-stone-900/60 cursor-crosshair"
          title="Drag to link to a label"
          @pointerdown.stop="startConnect($event, node)"
          @pointerup.stop="endConnect($event)"
        ></span>

        <template x-if="node.kind === 'label'">
          <div>
            <div class="map-font-title text-2xl sm:text-3xl font-bold leading-tight break-words" x-text="node.title"></div>
            <div x-show="node.note" class="map-font-hand text-xs mt-1 opacity-80 break-words" x-text="node.note"></div>
          </div>
        </template>

        <template x-if="node.kind !== 'label'">
          <div>
            <div class="text-[9px] uppercase tracking-wide font-semibold opacity-80" x-text="kindMeta[node.kind].label"></div>
            <div class="map-font-title text-xl leading-tight mt-0.5 break-words" x-text="cardTitle(node)"></div>
            <div class="map-font-hand text-[11px] mt-1 opacity-80 break-words" style="display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;" x-text="cardNote(node)"></div>
            <div x-show="node.target_date" class="map-font-hand text-[10px] mt-1.5 opacity-70" x-text="node.target_date ? ('by ' + node.target_date) : ''"></div>
          </div>
        </template>
      </div>
    </template>
  </div>

  <!-- Add-to-map popover -->
  <div x-show="adding" x-cloak @keydown.escape.window="adding = false" @click.self="adding = false" x-transition.opacity class="fixed inset-0 z-40 flex items-center justify-center bg-black/40 dark:bg-black/60 backdrop-blur-sm px-4">
    <div class="w-full max-w-sm rounded-lg bg-white dark:bg-stone-800 shadow-2xl border border-stone-200 dark:border-stone-700 p-4">
      <div class="font-serif text-base text-stone-900 dark:text-stone-100 mb-3">Add to map</div>

      <div class="flex flex-wrap gap-1.5 mb-3">
        <template x-for="k in kinds" :key="k">
          <button type="button" @click="newKind = k"
            :class="newKind === k ? kindMeta[k].badge : 'bg-stone-50 dark:bg-stone-900 text-stone-500 dark:text-stone-400 border-stone-200 dark:border-stone-700'"
            class="text-[11px] px-2.5 py-1 rounded-full border" x-text="kindMeta[k].label"></button>
        </template>
      </div>

      <template x-if="newKind === 'project'">
        <div>
          <select x-model="newProjectId" class="w-full text-xs bg-white dark:bg-stone-800 border border-stone-300 dark:border-stone-600 rounded px-2 py-1.5 text-stone-900 dark:text-stone-100 focus:outline-none focus:border-rust dark:focus:border-rust-light">
            <option value="">Pick a project&hellip;</option>
            <template x-for="p in pinnableProjects" :key="p.id">
              <option :value="p.id" x-text="p.name"></option>
            </template>
          </select>
          <p x-show="pinnableProjects.length === 0" class="text-[11px] text-stone-400 dark:text-stone-500 italic mt-1">All active projects are already pinned on this board.</p>
        </div>
      </template>

      <template x-if="newKind !== 'project'">
        <div class="space-y-2">
          <input type="text" x-model="newTitle" :placeholder="newKind === 'label' ? 'e.g. September' : 'Title'" class="w-full text-xs bg-white dark:bg-stone-800 border border-stone-300 dark:border-stone-600 rounded px-2 py-1.5 text-stone-900 dark:text-stone-100 focus:outline-none focus:border-rust dark:focus:border-rust-light">
          <textarea x-model="newNote" placeholder="Note (optional)" rows="2" class="w-full text-xs bg-white dark:bg-stone-800 border border-stone-300 dark:border-stone-600 rounded px-2 py-1.5 text-stone-900 dark:text-stone-100 focus:outline-none focus:border-rust dark:focus:border-rust-light resize-none"></textarea>
          <input x-show="newKind !== 'label'" type="date" x-model="newTargetDate" class="w-full text-xs bg-white dark:bg-stone-800 border border-stone-300 dark:border-stone-600 rounded px-2 py-1.5 text-stone-900 dark:text-stone-100 focus:outline-none focus:border-rust dark:focus:border-rust-light">
        </div>
      </template>

      <!-- Available for every kind, including project and label (a label linking to another label is a sublabel) -->
      <select x-show="labelOptions.length > 0" x-model="newLinkedLabelId" class="w-full text-xs bg-white dark:bg-stone-800 border border-stone-300 dark:border-stone-600 rounded px-2 py-1.5 text-stone-900 dark:text-stone-100 focus:outline-none focus:border-rust dark:focus:border-rust-light mt-2">
        <option value="">No label</option>
        <template x-for="l in labelOptions" :key="l.id">
          <option :value="l.id" x-text="'Link to ' + l.title"></option>
        </template>
      </select>

      <p x-show="addError" x-text="addError" class="text-[11px] text-red-600 dark:text-red-400 mt-2"></p>

      <div class="flex items-center justify-end gap-2 mt-4">
        <button type="button" @click="adding = false" class="text-xs px-3 py-1.5 rounded text-stone-500 dark:text-stone-400 hover:text-stone-900 dark:hover:text-stone-100">Cancel</button>
        <button type="button" @click="submitAdd()" class="text-xs px-3 py-1.5 rounded bg-rust hover:bg-[#9c4830] dark:bg-rust-light dark:hover:bg-[#e08761] text-white font-medium">Pin it</button>
      </div>
    </div>
  </div>

  <!-- Detail / edit modal -->
  <div x-show="active" x-cloak @keydown.escape.window="closeDetail()" @click.self="closeDetail()" x-transition.opacity class="fixed inset-0 z-40 flex items-center justify-center bg-black/40 dark:bg-black/60 backdrop-blur-sm px-4">
    <template x-if="active">
      <div class="w-full max-w-sm rounded-lg bg-white dark:bg-stone-800 shadow-2xl border border-stone-200 dark:border-stone-700 p-4">
        <div class="flex items-start justify-between gap-2 mb-2">
          <span class="text-[10px] uppercase tracking-wide px-1.5 py-0.5 rounded border" :class="kindMeta[active.kind].badge" x-text="kindMeta[active.kind].label"></span>
          <button type="button" @click="closeDetail()" class="text-stone-400 hover:text-stone-900 dark:hover:text-stone-100">&times;</button>
        </div>

        <template x-if="active.kind === 'project'">
          <div>
            <div class="map-font-title text-2xl text-stone-900 dark:text-stone-100" x-text="active.project_name"></div>
            <p x-show="active.project_current_sprint" class="text-xs text-stone-600 dark:text-stone-300 mt-1" x-text="active.project_current_sprint"></p>
            <p x-show="!active.project_current_sprint && active.project_description" class="text-xs text-stone-600 dark:text-stone-300 mt-1" x-text="active.project_description"></p>
            <a :href="'/projects/' + active.project_id" class="inline-block mt-3 text-xs font-medium text-rust dark:text-rust-light hover:underline">Open project &#8599;</a>
          </div>
        </template>

        <template x-if="active.kind !== 'project'">
          <div class="space-y-2">
            <input type="text" x-model="editTitle" class="w-full font-serif text-base bg-transparent border-b border-stone-200 dark:border-stone-700 px-0 py-1 text-stone-900 dark:text-stone-100 focus:outline-none focus:border-rust dark:focus:border-rust-light">
            <textarea x-model="editNote" rows="3" placeholder="Note" class="w-full text-xs bg-white dark:bg-stone-800 border border-stone-300 dark:border-stone-600 rounded px-2 py-1.5 text-stone-900 dark:text-stone-100 focus:outline-none focus:border-rust dark:focus:border-rust-light resize-none"></textarea>
            <input x-show="active.kind !== 'label'" type="date" x-model="editTargetDate" class="w-full text-xs bg-white dark:bg-stone-800 border border-stone-300 dark:border-stone-600 rounded px-2 py-1.5 text-stone-900 dark:text-stone-100 focus:outline-none focus:border-rust dark:focus:border-rust-light">
            <p x-show="editError" x-text="editError" class="text-[11px] text-red-600 dark:text-red-400"></p>
            <button type="button" @click="saveDetail()" :disabled="editSaving" class="text-xs px-3 py-1.5 rounded bg-rust hover:bg-[#9c4830] dark:bg-rust-light dark:hover:bg-[#e08761] text-white font-medium disabled:opacity-50">
              <span x-show="!editSaving">Save</span><span x-show="editSaving">Saving&hellip;</span>
            </button>
          </div>
        </template>

        <!-- Available for every kind, including project (its title/note/date
             stay locked to the project, but the label link is independent —
             see update_map_node_label_link) and label (a sublabel link). -->
        <select
          x-show="activeLabelOptions.length > 0"
          :value="active.linked_label_id || ''"
          @change="setLabelLink(active.id, $event.target.value ? Number($event.target.value) : null)"
          class="w-full text-xs bg-white dark:bg-stone-800 border border-stone-300 dark:border-stone-600 rounded px-2 py-1.5 text-stone-900 dark:text-stone-100 focus:outline-none focus:border-rust dark:focus:border-rust-light mt-2"
        >
          <option value="">No label</option>
          <template x-for="l in activeLabelOptions" :key="l.id">
            <option :value="l.id" x-text="'Link to ' + l.title"></option>
          </template>
        </select>

        <div class="flex items-center justify-end mt-4 pt-3 border-t border-stone-100 dark:border-stone-700">
          <button type="button" @click="removeActive()" class="text-[11px] text-stone-400 dark:text-stone-500 hover:text-red-600 dark:hover:text-red-400">
            <span x-text="active.kind === 'project' ? 'Unpin from map' : 'Delete card'"></span>
          </button>
        </div>
      </div>
    </template>
  </div>

</main>
{% endblock %}
